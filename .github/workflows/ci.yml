name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx prettier --check ./src
      - run: make copy-assets
      - run: NODE_ENV=production ./node_modules/.bin/rollup -c
      - run: npx playwright-core install --with-deps chromium
      - run: node test/browser.cjs
